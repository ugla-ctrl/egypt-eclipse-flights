name: Render share image and icons
on:
  push:
    paths: ["tools/**", "favicon.svg", ".github/workflows/assets.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tools/render.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og.jpg favicon-32.png apple-touch-icon.png
          git diff --cached --quiet || (git commit -m "Render share image and icons" && git push)
